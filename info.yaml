# Tiny Tapeout project information
project:
  title:        "UNAL's RISCV "      # Project title
  author:       "Carlos Camargo Bareño"      # Your name
  discord:      "cicamargo"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Bruno Levi's femtoRV imnplementation"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "4x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_femto"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "femto.v"
    - "MappedSPIMultidrop.v"
    - "perip_uart.v"
    - "uart.v"
    - "femtorv32_quark.v"
    

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: ""
  ui[1]: ""
  ui[2]: "RXD"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "spi_sck"
  uo[1]: "spi_cs_flash_n"
  uo[2]: "spi_cs_ram_n"
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: "LEDS"
  uo[7]: "TXD"

  # Bidirectional pins (bus SPI multi-drop flash + RAM)
  uio[0]: "spi_io0 (MOSI)"
  uio[1]: "spi_io1 (MISO)"
  uio[2]: "spi_io2"
  uio[3]: "spi_io3"
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
