name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      # Solo se ejecutan las pruebas de ACEPTACION (REQ-01 .. REQ-08).
      - name: Run acceptance tests
        run: |
          cd test
          make clean
          make acceptance
          # make devuelve exito aunque una prueba falle (el RUN usa '|| true'),
          # asi que se revisa el XML de resultados.
          test -s results/standard/acceptance.xml
          ! grep -q "<failure" results/standard/acceptance.xml

      - name: Test Summary
        uses: test-summary/action@v2.3
        with:
          paths: "test/results/standard/acceptance.xml"
        if: always()

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-results
          path: |
            test/results/standard/acceptance.xml
            test/*.vcd
