# Configuración de Jekyll para GitHub Pages (rama gh_pages, carpeta /docs)
title: femto_UN
description: Documentación del SoC RISC-V femto_UN (FemtoRV32 Quark + flash QSPI + SPI RAM + UART) para Tiny Tapeout
lang: es
url: "https://dvillamor0.github.io"
