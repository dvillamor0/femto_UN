<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-labelledby="t d">
<title id="t">Prueba aleatoria diferencial contra el ISS</title>
<desc id="d">La semilla genera un programa aleatorio; se ejecuta en el ISS y en el RTL (CoreTB) y se comparan traza de PC, registros y memoria de datos.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1b211e"/></marker>
<marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L12 6L0 12z" fill="#f6f3ea" stroke="#1b211e" stroke-width="1.2"/></marker></defs>
<rect width="960" height="500" rx="10" fill="#f6f3ea"/>
<rect x="380" y="20" width="200" height="50" rx="4" fill="#fffdf6" stroke="#1b211e" stroke-width="1.6"/>
<text x="480.0" y="38" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1b211e">seed · n_items</text>
<text x="480.0" y="55" font-size="10.5" text-anchor="middle" fill="#5d6862">random.Random(seed)</text>
<rect x="330" y="100" width="300" height="64" rx="4" fill="#d8ece6" stroke="#0d6a5c" stroke-width="1.6"/>
<text x="480.0" y="118" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1b211e">gen_random_program(rng, n)</text>
<text x="480.0" y="135" font-size="10.5" text-anchor="middle" fill="#5d6862">→ (Prog, halt_addr)</text>
<text x="480.0" y="149" font-size="10.5" text-anchor="middle" fill="#5d6862">solo saltos hacia adelante</text>
<path d="M480 70 L480 100" fill="none" stroke="#1b211e" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M480 164 L480 190 L230 190 L230 216" fill="none" stroke="#1b211e" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M480 164 L480 190 L730 190 L730 216" fill="none" stroke="#1b211e" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="60" y="216" width="340" height="90" rx="4" fill="#f6e1d0" stroke="#b24d17" stroke-width="1.6"/>
<text x="230.0" y="234" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1b211e">Referencia: ISS</text>
<text x="230.0" y="251" font-size="10.5" text-anchor="middle" fill="#5d6862">iss_mem ← words + datos iniciales</text>
<text x="230.0" y="265" font-size="10.5" text-anchor="middle" fill="#5d6862">ISS(iss_mem).run(halt)</text>
<text x="230.0" y="279" font-size="10.5" text-anchor="middle" fill="#5d6862">→ iss.trace · iss.x[0..31] · iss_mem</text>
<rect x="560" y="216" width="340" height="90" rx="4" fill="#f6e1d0" stroke="#b24d17" stroke-width="1.6"/>
<text x="730.0" y="234" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1b211e">DUT: FemtoRV32 en CoreTB</text>
<text x="730.0" y="251" font-size="10.5" text-anchor="middle" fill="#5d6862">tb.run(prog, halt) con rbusy/wbusy</text>
<text x="730.0" y="265" font-size="10.5" text-anchor="middle" fill="#5d6862">aleatorios 0..4 (o sin esperas)</text>
<text x="730.0" y="279" font-size="10.5" text-anchor="middle" fill="#5d6862">→ fetch_trace · regs() · tb.mem</text>
<path d="M230 306 L230 350 L440 350" fill="none" stroke="#1b211e" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M730 306 L730 350 L520 350" fill="none" stroke="#1b211e" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="330" y="330" width="300" height="40" rx="4" fill="#fffdf6" stroke="#1b211e" stroke-width="1.6"/>
<text x="480.0" y="348" font-size="12" font-weight="700" text-anchor="middle" fill="#1b211e">3 comparaciones</text>
<rect x="30" y="400" width="290" height="62" rx="4" fill="#e5e1d4" stroke="#7b857f" stroke-width="1.6"/>
<text x="175.0" y="418" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1b211e">1 · traza de PC</text>
<text x="175.0" y="435" font-size="10.5" text-anchor="middle" fill="#5d6862">hw_trace == iss.trace</text>
<text x="175.0" y="449" font-size="10.5" text-anchor="middle" fill="#5d6862">cubre branch / JAL / JALR</text>
<path d="M480 370 L480 385 L175 385 L175 400" fill="none" stroke="#1b211e" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="340" y="400" width="290" height="62" rx="4" fill="#e5e1d4" stroke="#7b857f" stroke-width="1.6"/>
<text x="485.0" y="418" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1b211e">2 · registros</text>
<text x="485.0" y="435" font-size="10.5" text-anchor="middle" fill="#5d6862">x0…x31: hw == iss.x[i]</text>
<text x="485.0" y="449" font-size="10.5" text-anchor="middle" fill="#5d6862">mensaje con la semilla</text>
<path d="M480 370 L480 385 L485 385 L485 400" fill="none" stroke="#1b211e" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="650" y="400" width="290" height="62" rx="4" fill="#e5e1d4" stroke="#7b857f" stroke-width="1.6"/>
<text x="795.0" y="418" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1b211e">3 · memoria de datos</text>
<text x="795.0" y="435" font-size="10.5" text-anchor="middle" fill="#5d6862">0x20000…0x203FF</text>
<text x="795.0" y="449" font-size="10.5" text-anchor="middle" fill="#5d6862">cargas y almacenamientos</text>
<path d="M480 370 L480 385 L795 385 L795 400" fill="none" stroke="#1b211e" stroke-width="1.5" marker-end="url(#a)"/>
<text x="30" y="488" font-size="10" fill="#5d6862">Dos pruebas lo usan: test_random_vs_iss_no_wait (seeds 100+) y test_random_vs_iss_with_wait_states (seeds 500+); N_RANDOM = 12 por defecto.</text>
</svg>
