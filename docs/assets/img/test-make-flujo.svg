<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-labelledby="t d">
<title id="t">Flujo de make: del objetivo al informe</title>
<desc id="d">make unit/integration/... invoca la macro RUN, que fija variables de entorno y llama a Makefile.sim (cocotb + Icarus); el resultado es un XML que report.py resume.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1b211e"/></marker>
<marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L12 6L0 12z" fill="#f6f3ea" stroke="#1b211e" stroke-width="1.2"/></marker></defs>
<rect width="960" height="360" rx="10" fill="#f6f3ea"/>
<rect x="20" y="40" width="172" height="110" rx="4" fill="#fffdf6" stroke="#1b211e" stroke-width="1.6"/>
<text x="106.0" y="58" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1b211e">make unit-quark</text>
<text x="106.0" y="75" font-size="10" text-anchor="middle" fill="#5d6862">objetivo de test/Makefile</text>
<text x="106.0" y="89" font-size="10" text-anchor="middle" fill="#5d6862">$(call RUN, nombre,</text>
<text x="106.0" y="103" font-size="10" text-anchor="middle" fill="#5d6862">toplevel, módulo,</text>
<text x="106.0" y="117" font-size="10" text-anchor="middle" fill="#5d6862">fuentes, args)</text>
<rect x="204" y="40" width="172" height="110" rx="4" fill="#f6e1d0" stroke="#b24d17" stroke-width="1.6"/>
<text x="290.0" y="58" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1b211e">macro RUN</text>
<text x="290.0" y="75" font-size="10" text-anchor="middle" fill="#5d6862">SIM_BUILD · TOPLEVEL</text>
<text x="290.0" y="89" font-size="10" text-anchor="middle" fill="#5d6862">COCOTB_TEST_MODULES</text>
<text x="290.0" y="103" font-size="10" text-anchor="middle" fill="#5d6862">VERILOG_SOURCES</text>
<text x="290.0" y="117" font-size="10" text-anchor="middle" fill="#5d6862">COMPILE_ARGS · RESULTS</text>
<path d="M192 95 L204 95" fill="none" stroke="#1b211e" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="388" y="40" width="172" height="110" rx="4" fill="#f6e1d0" stroke="#b24d17" stroke-width="1.6"/>
<text x="474.0" y="58" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1b211e">Makefile.sim</text>
<text x="474.0" y="75" font-size="10" text-anchor="middle" fill="#5d6862">plantilla cocotb:</text>
<text x="474.0" y="89" font-size="10" text-anchor="middle" fill="#5d6862">cocotb-config --makefiles</text>
<text x="474.0" y="103" font-size="10" text-anchor="middle" fill="#5d6862">SIM=icarus</text>
<text x="474.0" y="117" font-size="10" text-anchor="middle" fill="#5d6862">TOPLEVEL_LANG=verilog</text>
<path d="M376 95 L388 95" fill="none" stroke="#1b211e" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="572" y="40" width="172" height="110" rx="4" fill="#d8ece6" stroke="#0d6a5c" stroke-width="1.6"/>
<text x="658.0" y="58" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1b211e">iverilog + vvp</text>
<text x="658.0" y="75" font-size="10" text-anchor="middle" fill="#5d6862">compila VERILOG_SOURCES</text>
<text x="658.0" y="89" font-size="10" text-anchor="middle" fill="#5d6862">carga cocotb y ejecuta</text>
<text x="658.0" y="103" font-size="10" text-anchor="middle" fill="#5d6862">los @cocotb.test()</text>
<text x="658.0" y="117" font-size="10" text-anchor="middle" fill="#5d6862">del módulo (PYTHONPATH)</text>
<path d="M560 95 L572 95" fill="none" stroke="#1b211e" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="756" y="40" width="172" height="110" rx="4" fill="#e5e1d4" stroke="#7b857f" stroke-width="1.6"/>
<text x="842.0" y="58" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1b211e">results/&lt;perfil&gt;/</text>
<text x="842.0" y="75" font-size="10" text-anchor="middle" fill="#5d6862">nombre.xml (JUnit)</text>
<text x="842.0" y="89" font-size="10" text-anchor="middle" fill="#5d6862">make report →</text>
<text x="842.0" y="103" font-size="10" text-anchor="middle" fill="#5d6862">tools/report.py</text>
<text x="842.0" y="117" font-size="10" text-anchor="middle" fill="#5d6862">tabla por nivel</text>
<path d="M744 95 L756 95" fill="none" stroke="#1b211e" stroke-width="1.5" marker-end="url(#a)"/>
<text x="20" y="190" font-size="12" font-weight="700" fill="#1b211e">Variables que conviene conocer</text>
<text x="30" y="214" font-size="11" font-weight="700" fill="#1b211e">MEM_PROFILE / PROFILE</text>
<text x="260" y="214" font-size="10.5" fill="#5d6862">standard (por defecto). Elige subcarpeta results/&lt;perfil&gt;/.</text>
<text x="30" y="236" font-size="11" font-weight="700" fill="#1b211e">PYTHONPATH</text>
<text x="260" y="236" font-size="10.5" fill="#5d6862">lib/ + unit/ integration/ functional/ e2e/ acceptance/ hw/ tools/ → import soc, rvlib, fw, spimodels.</text>
<text x="30" y="258" font-size="11" font-weight="700" fill="#1b211e">RF_SRC / SOC_SRC</text>
<text x="260" y="258" font-size="10.5" fill="#5d6862">fuentes del SoC: femto.v, quark, regfile SRAM + modelo de macro, UART, MappedSPIMultidrop.</text>
<text x="30" y="280" font-size="11" font-weight="700" fill="#1b211e">N_RANDOM</text>
<text x="260" y="280" font-size="10.5" fill="#5d6862">nº de semillas de las pruebas aleatorias del Quark (12 por defecto).</text>
<text x="30" y="302" font-size="11" font-weight="700" fill="#1b211e">make dbg MOD=x</text>
<text x="260" y="302" font-size="10.5" fill="#5d6862">ejecuta el módulo test/**/x.py sobre tt_um_femto (herramienta de depuración).</text>
<text x="20" y="340" font-size="10.5" fill="#5d6862">La macro RUN termina con "|| true": un fallo no corta make; el fallo se lee en el XML (&lt;failure&gt;) o con make report.</text>
</svg>
