<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-labelledby="t d">
<title id="t">Qué hacen los modelos de memoria y el monitor UART</title>
<desc id="d">Línea de tiempo de QspiFlashTarget (0xEB), SpiTarget en modo RAM (0x03/0x02) y UartMonitor (8N1 muestreado por tiempo).</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1b211e"/></marker>
<marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L12 6L0 12z" fill="#f6f3ea" stroke="#1b211e" stroke-width="1.2"/></marker></defs>
<rect width="960" height="460" rx="10" fill="#f6f3ea"/>
<text x="30" y="30" font-size="12" font-weight="700" fill="#1b211e">QspiFlashTarget · solo Fast Read Quad I/O 0xEB · SPI modo 0 (muestrea en subida, cambia en bajada)</text>
<rect x="30" y="42" width="257.14285714285717" height="50" rx="4" fill="#f6e1d0" stroke="#b24d17" stroke-width="1.6"/>
<text x="158.57142857142858" y="64" font-size="11" font-weight="700" text-anchor="middle" fill="#1b211e">opcode</text>
<text x="158.57142857142858" y="80" font-size="10" text-anchor="middle" fill="#5d6862">8 SCK</text>
<rect x="287.14285714285717" y="42" width="192.8571428571429" height="50" rx="4" fill="#f6e1d0" stroke="#b24d17" stroke-width="1.6"/>
<text x="383.5714285714286" y="64" font-size="11" font-weight="700" text-anchor="middle" fill="#1b211e">dirección</text>
<text x="383.5714285714286" y="80" font-size="10" text-anchor="middle" fill="#5d6862">6 SCK</text>
<rect x="480.00000000000006" y="42" width="64.28571428571429" height="50" rx="4" fill="#f6e1d0" stroke="#b24d17" stroke-width="1.6"/>
<text x="512.1428571428572" y="64" font-size="11" font-weight="700" text-anchor="middle" fill="#1b211e">modo</text>
<text x="512.1428571428572" y="80" font-size="10" text-anchor="middle" fill="#5d6862">2 SCK</text>
<rect x="544.2857142857143" y="42" width="128.57142857142858" height="50" rx="4" fill="#e5e1d4" stroke="#7b857f" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="608.5714285714287" y="64" font-size="11" font-weight="700" text-anchor="middle" fill="#1b211e">dummy</text>
<text x="608.5714285714287" y="80" font-size="10" text-anchor="middle" fill="#5d6862">4 SCK</text>
<rect x="672.8571428571429" y="42" width="257.14285714285717" height="50" rx="4" fill="#d8ece6" stroke="#0d6a5c" stroke-width="1.6"/>
<text x="801.4285714285714" y="64" font-size="11" font-weight="700" text-anchor="middle" fill="#1b211e">datos</text>
<text x="801.4285714285714" y="80" font-size="10" text-anchor="middle" fill="#5d6862">8 SCK</text>
<text x="30" y="112" font-size="10" fill="#5d6862">cmd = bits de IO0 · addr = nibbles IO3..IO0 · tras 20 subidas presenta un nibble por bajada: mem[addr + k//2] (alto primero)</text>
<text x="30" y="128" font-size="10" fill="#5d6862">Un opcode distinto de 0xEB se ignora; la transacción queda en flash.transactions (cmd, addr, rises, falls, rbits…)</text>
<text x="30" y="170" font-size="12" font-weight="700" fill="#1b211e">SpiTarget (kind="ram", profile="standard") · 0x03 lectura / 0x02 escritura</text>
<rect x="30" y="182" width="112.5" height="50" rx="4" fill="#f6e1d0" stroke="#b24d17" stroke-width="1.6"/>
<text x="86.25" y="204" font-size="11" font-weight="700" text-anchor="middle" fill="#1b211e">cmd</text>
<text x="86.25" y="220" font-size="10" text-anchor="middle" fill="#5d6862">8 SCK</text>
<rect x="142.5" y="182" width="337.5" height="50" rx="4" fill="#f6e1d0" stroke="#b24d17" stroke-width="1.6"/>
<text x="311.25" y="204" font-size="11" font-weight="700" text-anchor="middle" fill="#1b211e">dirección</text>
<text x="311.25" y="220" font-size="10" text-anchor="middle" fill="#5d6862">24 SCK</text>
<rect x="480.0" y="182" width="450.0" height="50" rx="4" fill="#d8ece6" stroke="#0d6a5c" stroke-width="1.6"/>
<text x="705.0" y="204" font-size="11" font-weight="700" text-anchor="middle" fill="#1b211e">datos de 32 bits</text>
<text x="705.0" y="220" font-size="10" text-anchor="middle" fill="#5d6862">32 SCK</text>
<text x="30" y="252" font-size="10" fill="#5d6862">lectura: tras 32 subidas cada bajada presenta un bit de mem[addr…] · escritura: cada 8 subidas almacena un byte (big-endian al verlo como palabra)</text>
<text x="30" y="268" font-size="10" fill="#5d6862">set_word_be / get_word_be acceden a la palabra tal como viaja por el bus (byte alto primero).</text>
<text x="30" y="310" font-size="12" font-weight="700" fill="#1b211e">UartMonitor · 8N1 en uo_out[7] · cpb = 208 ciclos de reloj (clk_ns = 20)</text>
<rect x="30.0" y="322" width="90.0" height="40" rx="4" fill="#f6e1d0" stroke="#b24d17" stroke-width="1.6"/>
<text x="75.0" y="347" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1b211e">inicio</text>
<rect x="120.0" y="322" width="90.0" height="40" rx="4" fill="#d8ece6" stroke="#0d6a5c" stroke-width="1.6"/>
<text x="165.0" y="347" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1b211e">b0</text>
<circle cx="165.0" cy="372" r="3" fill="#1b211e"/>
<rect x="210.0" y="322" width="90.0" height="40" rx="4" fill="#d8ece6" stroke="#0d6a5c" stroke-width="1.6"/>
<text x="255.0" y="347" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1b211e">b1</text>
<circle cx="255.0" cy="372" r="3" fill="#1b211e"/>
<rect x="300.0" y="322" width="90.0" height="40" rx="4" fill="#d8ece6" stroke="#0d6a5c" stroke-width="1.6"/>
<text x="345.0" y="347" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1b211e">b2</text>
<circle cx="345.0" cy="372" r="3" fill="#1b211e"/>
<rect x="390.0" y="322" width="90.0" height="40" rx="4" fill="#d8ece6" stroke="#0d6a5c" stroke-width="1.6"/>
<text x="435.0" y="347" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1b211e">b3</text>
<circle cx="435.0" cy="372" r="3" fill="#1b211e"/>
<rect x="480.0" y="322" width="90.0" height="40" rx="4" fill="#d8ece6" stroke="#0d6a5c" stroke-width="1.6"/>
<text x="525.0" y="347" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1b211e">b4</text>
<circle cx="525.0" cy="372" r="3" fill="#1b211e"/>
<rect x="570.0" y="322" width="90.0" height="40" rx="4" fill="#d8ece6" stroke="#0d6a5c" stroke-width="1.6"/>
<text x="615.0" y="347" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1b211e">b5</text>
<circle cx="615.0" cy="372" r="3" fill="#1b211e"/>
<rect x="660.0" y="322" width="90.0" height="40" rx="4" fill="#d8ece6" stroke="#0d6a5c" stroke-width="1.6"/>
<text x="705.0" y="347" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1b211e">b6</text>
<circle cx="705.0" cy="372" r="3" fill="#1b211e"/>
<rect x="750.0" y="322" width="90.0" height="40" rx="4" fill="#d8ece6" stroke="#0d6a5c" stroke-width="1.6"/>
<text x="795.0" y="347" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1b211e">b7</text>
<circle cx="795.0" cy="372" r="3" fill="#1b211e"/>
<rect x="840.0" y="322" width="90.0" height="40" rx="4" fill="#f6e1d0" stroke="#b24d17" stroke-width="1.6"/>
<text x="885.0" y="347" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1b211e">stop</text>
<circle cx="75" cy="372" r="3" fill="#b24d17"/>
<text x="30" y="396" font-size="10" fill="#5d6862">Detecta el flanco de bajada → espera 1,5 bits → muestrea 8 bits (uno por bit) → comprueba el stop (si es 0: errors.append).</text>
<text x="30" y="412" font-size="10" fill="#5d6862">Muestrea por tiempo (Timer), no mira la UART interna: cycles_per_bit debe coincidir con el RTL que se simula.</text>
<text x="30" y="428" font-size="10" fill="#5d6862">Hoy el RTL emite 217 ciclos/bit a 25 MHz y soc.py usa 208: por cálculo aún cae dentro de cada bit, pero con poco margen (L10).</text>
</svg>
