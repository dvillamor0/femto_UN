<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-labelledby="t d">
<title id="t">Transacciones del bus SPI multidrop</title>
<desc id="d">Lectura de flash: 28 ciclos de SCK (8 de opcode, 6 de dirección, 2 de modo, 4 dummy y 8 de datos). Lectura o escritura de RAM: 64 ciclos de SCK (32 de cabecera y 32 de datos).</desc>
<rect width="960" height="330" rx="10" fill="#f6f3ea"/>
<text x="30" y="34" font-size="13" font-weight="700" fill="#1b211e">Flash · Fast Read Quad I/O (0xEB) · 28 ciclos de SCK</text>
<g font-size="11.5" text-anchor="middle" fill="#1b211e">
<rect x="30" y="48" width="240" height="56" fill="#f6e1d0" stroke="#b24d17" stroke-width="1.6"/>
<text x="150" y="72" font-weight="700">OPCODE</text><text x="150" y="90" fill="#5d6862" font-size="10.5">8 ciclos · IO0</text>
<rect x="270" y="48" width="180" height="56" fill="#f6e1d0" stroke="#b24d17" stroke-width="1.6"/>
<text x="360" y="72" font-weight="700">DIRECCIÓN</text><text x="360" y="90" fill="#5d6862" font-size="10.5">6 ciclos · IO0–IO3</text>
<rect x="450" y="48" width="60" height="56" fill="#f6e1d0" stroke="#b24d17" stroke-width="1.6"/>
<text x="480" y="72" font-weight="700">MODO</text><text x="480" y="90" fill="#5d6862" font-size="10.5">2</text>
<rect x="510" y="48" width="120" height="56" fill="#e5e1d4" stroke="#7b857f" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="570" y="72" font-weight="700">DUMMY</text><text x="570" y="90" fill="#5d6862" font-size="10.5">4 · bus liberado</text>
<rect x="630" y="48" width="240" height="56" fill="#d8ece6" stroke="#0d6a5c" stroke-width="1.6"/>
<text x="750" y="72" font-weight="700">DATOS (32 bits)</text><text x="750" y="90" fill="#5d6862" font-size="10.5">8 ciclos · IO0–IO3 · maneja la flash</text>
</g>
<text x="30" y="124" font-size="10.5" fill="#5d6862">SCK = clk / 4 (FLASH_DIV = 2) → 28 × 4 = 112 ciclos de reloj por lectura</text>

<text x="30" y="178" font-size="13" font-weight="700" fill="#1b211e">RAM · lectura 0x03 / escritura 0x02 · 64 ciclos de SCK</text>
<g font-size="11.5" text-anchor="middle" fill="#1b211e">
<rect x="30" y="192" width="420" height="56" fill="#f6e1d0" stroke="#b24d17" stroke-width="1.6"/>
<text x="240" y="216" font-weight="700">CABECERA</text><text x="240" y="234" fill="#5d6862" font-size="10.5">32 ciclos · IO0 · comando 8 + ceros 8 + dirección 16</text>
<rect x="450" y="192" width="420" height="56" fill="#d8ece6" stroke="#0d6a5c" stroke-width="1.6"/>
<text x="660" y="216" font-weight="700">DATOS (32 bits)</text><text x="660" y="234" fill="#5d6862" font-size="10.5">32 ciclos · lectura: IO1 · escritura: IO0</text>
</g>
<text x="30" y="268" font-size="10.5" fill="#5d6862">SCK = clk / 10 (RAM_DIV = 5) → 64 × 10 = 640 ciclos de reloj por acceso (otra escala)</text>

<g font-size="10.5" fill="#1b211e">
<rect x="30" y="288" width="14" height="14" fill="#f6e1d0" stroke="#b24d17" stroke-width="1.4"/><text x="52" y="299">lo maneja el SoC (maestro)</text>
<rect x="250" y="288" width="14" height="14" fill="#d8ece6" stroke="#0d6a5c" stroke-width="1.4"/><text x="272" y="299">lo maneja la memoria (esclavo)</text>
<rect x="500" y="288" width="14" height="14" fill="#e5e1d4" stroke="#7b857f" stroke-width="1.4" stroke-dasharray="3 2"/><text x="522" y="299">bus en alta impedancia</text>
<text x="730" y="299" fill="#5d6862">Las filas no están a la misma escala.</text>
</g>
</svg>
