<text x="20" y="520" font-size="12" font-weight="700" fill="#1b211e">Relaciones</text>
<text x="20" y="540" font-size="10.5" fill="#5d6862">· Soc crea una SocPins por esclavo y la pasa a SpiTarget.</text>
<text x="20" y="558" font-size="10.5" fill="#5d6862">· SpiTarget solo usa pins.read() y pins.drive_miso().</text>
<text x="20" y="576" font-size="10.5" fill="#5d6862">· MdBench (unit_multidrop) reutiliza los mismos esclavos con MdPins.</text>
<text x="20" y="594" font-size="10.5" fill="#5d6862">· Prog es solo un diccionario de palabras: el ISS y la flash lo reciben como bytes.</text>
